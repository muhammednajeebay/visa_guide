<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VisaGuide</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding-top: 0;
            background: #f9f9f9;
        }

        .admin-nav {
            background: var(--primary-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .json-editor {
            width: 100%;
            height: 600px;
            font-family: monospace;
            padding: 15px;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            background: white;
            margin-bottom: 20px;
        }

        .status-msg {
            padding: 10px;
            border-radius: 6px;
            display: none;
            margin-bottom: 20px;
        }

        .status-success {
            background: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <nav class="admin-nav">
        <h3>VisaGuide Admin</h3>
        <button onclick="logout()" class="btn-outline" style="color: white; border-color: white;">Logout</button>
    </nav>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Content Editor</h2>
            <button onclick="saveData()" class="btn-primary">Save Changes</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
        <p>Edit the raw JSON below to update the website content. Be careful with syntax.</p>

        <textarea id="jsonEditor" class="json-editor">Loading...</textarea>
    </div>

    <script>
        // Auth Check
        if (localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'auth.html';
        }

        const editor = document.getElementById('jsonEditor');
        const statusMsg = document.getElementById('statusMsg');

        // Load Data
        async function loadData() {
            try {
                const res = await fetch('/static/data.json');
                const data = await res.json();
                editor.value = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error(err);
                editor.value = 'Error loading data.';
            }
        }

        // Save Data
        async function saveData() {
            try {
                const newData = JSON.parse(editor.value);

                const res = await fetch('/api/save-portfolio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newData)
                });

                if (res.ok) {
                    showStatus('Changes saved successfully!', 'success');
                } else {
                    showStatus('Failed to save changes.', 'error');
                }
            } catch (err) {
                showStatus('Invalid JSON format. Please fix errors.', 'error');
            }
        }

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `status-msg status-${type}`;
            statusMsg.style.display = 'block';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }

        function logout() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'auth.html';
        }

        loadData();
    </script>
</body>

</html>
