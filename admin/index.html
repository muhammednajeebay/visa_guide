<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VisaGuide</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding-top: 0;
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .admin-nav {
            background: var(--primary-blue);
            color: white;
            padding: 0 30px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .dashboard-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Tabs */
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid var(--border-gray);
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .tab-btn {
            padding: 15px 20px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark-gray);
            border-left: 4px solid transparent;
            transition: 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .tab-btn:hover {
            background: #f9fafb;
            color: var(--primary-blue);
        }

        .tab-btn.active {
            background: #eff6ff;
            color: var(--primary-blue);
            border-left-color: var(--primary-blue);
        }

        /* Main Content */
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .form-section {
            display: none;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 60px;
            /* Space for fixed save button */
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Controls */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-gray);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-gray);
            border-radius: 6px;
            font-family: inherit;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--trust-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(46, 125, 209, 0.1);
        }

        /* Nested Objects / Arrays */
        .nested-group {
            margin-left: 20px;
            padding-left: 20px;
            border-left: 2px solid var(--border-gray);
            margin-bottom: 20px;
        }

        .array-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid var(--border-gray);
        }

        .btn-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-add {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 5px;
        }

        /* Floating Save Bar */
        .save-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 30px;
            border-top: 1px solid var(--border-gray);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        .status-msg {
            margin-right: 15px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .status-success {
            color: #059669;
        }

        .status-error {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <!-- Nav -->
    <nav class="admin-nav">
        <h3>VisaGuide CMS</h3>
        <div>
            <span style="font-size: 0.9rem; opacity: 0.8; margin-right: 15px;">Logged in as Admin</span>
            <button onclick="logout()" class="btn-outline"
                style="color: white; border-color: rgba(255,255,255,0.3); padding: 5px 15px; font-size: 0.85rem;">Logout</button>
        </div>
    </nav>

    <!-- Layout -->
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <!-- Tabs injected here -->
        </aside>

        <main class="content-area">
            <div id="formsContainer">
                <!-- Forms injected here -->
                <div style="text-align: center; margin-top: 100px; color: #666;">
                    Loading content...
                </div>
            </div>

            <!-- Sticky Save Bar inside content area to be always accessible if we want, or fixed -->
        </main>

        <div class="save-bar">
            <span id="statusMsg" class="status-msg"></span>
            <button onclick="saveData()" class="btn-primary">Save Changes</button>
        </div>
    </div>

    <script>
        // Auth Check
        if (localStorage.getItem('isAdmin') !== 'true') { window.location.href = 'auth.html'; }

        let currentData = {};

        const sidebar = document.getElementById('sidebar');
        const container = document.getElementById('formsContainer');
        const statusMsg = document.getElementById('statusMsg');

        // Initial Load
        async function loadData() {
            try {
                const res = await fetch('/static/data.json');
                currentData = await res.json();
                renderUI(currentData);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color:red; text-align:center; margin-top:50px;">Error loading data.</p>';
            }
        }

        // Render Tabs and Forms
        function renderUI(data) {
            sidebar.innerHTML = '';
            container.innerHTML = '';

            const keys = Object.keys(data); // hero, about, etc.

            keys.forEach((key, index) => {
                // 1. Create Tab
                const btn = document.createElement('button');
                btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = capitalize(key);
                btn.onclick = () => switchTab(key, btn);
                sidebar.appendChild(btn);

                // 2. Create Form Section
                const formDiv = document.createElement('div');
                formDiv.className = `form-section ${index === 0 ? 'active' : ''}`;
                formDiv.id = `section-${key}`;
                formDiv.innerHTML = `<h2>${capitalize(key)} Section</h2>`;

                // 3. Generate Fields
                generateFields(data[key], formDiv, [key]);

                container.appendChild(formDiv);
            });
        }

        // Recursive Field Generator
        function generateFields(obj, parentEl, path) {
            if (typeof obj !== 'object' || obj === null) return;

            // Arrays
            if (Array.isArray(obj)) {
                // We assume arrays contain objects of uniform type or strings
                const arrayContainer = document.createElement('div');
                arrayContainer.className = 'form-group';

                const label = document.createElement('label');
                label.textContent = capitalize(path[path.length - 1]);
                arrayContainer.appendChild(label);

                const itemsDiv = document.createElement('div');
                itemsDiv.id = `list-${path.join('-')}`;

                // Render existing items
                obj.forEach((item, idx) => {
                    const itemWrapper = createArrayItemWrapper(item, [...path, idx], itemsDiv, obj);
                    itemsDiv.appendChild(itemWrapper);
                });

                arrayContainer.appendChild(itemsDiv);

                // Add Button
                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'btn-add';
                addBtn.textContent = '+ Add Item';
                addBtn.onclick = () => {
                    // Clone structure of first item or empty string
                    const template = obj.length > 0 ? obj[0] : (typeof obj[0] === 'string' ? '' : {});
                    // Deep clone if object
                    const newItem = typeof template === 'object' ? JSON.parse(JSON.stringify(template)) : "";

                    // If object, clear values
                    if (typeof newItem === 'object') {
                        Object.keys(newItem).forEach(k => newItem[k] = "");
                    }

                    // Add to data model
                    // We need a way to update `currentData` dynamically. 
                    // Actually, simpler approach: Just render UI, and rely on inputs to update `currentData` reference? 
                    // No, we should modify the data object and re-render this array part.
                    // For simplicity in this robust editor, we'll re-render the whole array UI or just append.

                    // Let's modify the actual pointer in currentData
                    const arr = getNestedValue(currentData, path);
                    arr.push(newItem);

                    // Re-render this specific array container's children is best, but for MVP re-render whole UI is safer 
                    // Re-rendering whole UI loses focus. Let's append DOM.
                    const newIdx = arr.length - 1;
                    const wrapper = createArrayItemWrapper(newItem, [...path, newIdx], itemsDiv, arr);
                    itemsDiv.appendChild(wrapper);
                };

                arrayContainer.appendChild(addBtn);
                parentEl.appendChild(arrayContainer);
                return;
            }

            // Objects
            Object.keys(obj).forEach(k => {
                const val = obj[k];
                const currentPath = [...path, k];

                if (Array.isArray(val)) {
                    generateFields(val, parentEl, currentPath);
                } else if (typeof val === 'object' && val !== null) {
                    const group = document.createElement('div');
                    group.className = 'nested-group';
                    const title = document.createElement('h4');
                    title.textContent = capitalize(k);
                    title.style.marginBottom = '10px';
                    group.appendChild(title);

                    generateFields(val, group, currentPath);
                    parentEl.appendChild(group);
                } else {
                    // Primitive (String/Number/Boolean)
                    const group = document.createElement('div');
                    group.className = 'form-group';

                    const label = document.createElement('label');
                    label.textContent = capitalize(k);

                    let input;
                    const isFlagField = k === 'flag' && path.includes('destinations');

                    if (isFlagField) {
                        input = document.createElement('select');
                        input.innerHTML = `<option value="">Select Country</option>` +
                            Object.entries(allCountries).map(([code, name]) =>
                                `<option value="${code}" ${val === code ? 'selected' : ''}>${name} (${code.toUpperCase()})</option>`
                            ).join('');
                    } else {
                        input = document.createElement(val.length > 60 ? 'textarea' : 'input');
                        if (val.length > 60) input.rows = 3;
                        else input.type = typeof val === 'number' ? 'number' : 'text';
                        input.value = val;
                    }

                    // Data Binding
                    input.oninput = (e) => {
                        setNestedValue(currentData, currentPath, e.target.value);

                        // Auto-fill name if it's the destination flag being changed
                        if (isFlagField) {
                            const namePath = [...currentPath];
                            namePath[namePath.length - 1] = 'name';
                            const countryName = allCountries[e.target.value];
                            if (countryName) {
                                setNestedValue(currentData, namePath, countryName);
                                // We need to update the actual DOM input for 'name' too
                                // For simplicity, we can just re-render this section or find the input
                                const nameInput = parentEl.querySelector(`input[data-path="${namePath.join('-')}"]`);
                                if (nameInput) nameInput.value = countryName;
                            }
                        }
                    };

                    if (!isFlagField && input.tagName === 'INPUT') {
                        input.setAttribute('data-path', currentPath.join('-'));
                    }

                    group.appendChild(label);
                    group.appendChild(input);
                    parentEl.appendChild(group);
                }
            });
        }

        const allCountries = {
            "af": "Afghanistan", "ax": "Aland Islands", "al": "Albania", "dz": "Algeria", "as": "American Samoa", "ad": "Andorra", "ao": "Angola", "ai": "Anguilla", "aq": "Antarctica", "ag": "Antigua and Barbuda", "ar": "Argentina", "am": "Armenia", "aw": "Aruba", "au": "Australia", "at": "Austria", "az": "Azerbaijan", "bs": "Bahamas", "bh": "Bahrain", "bd": "Bangladesh", "bb": "Barbados", "by": "Belarus", "be": "Belgium", "bz": "Belize", "bj": "Benin", "bm": "Bermuda", "bt": "Bhutan", "bo": "Bolivia", "bq": "Bonaire, Sint Eustatius and Saba", "ba": "Bosnia and Herzegovina", "bw": "Botswana", "bv": "Bouvet Island", "br": "Brazil", "io": "British Indian Ocean Territory", "bn": "Brunei Darussalam", "bg": "Bulgaria", "bf": "Burkina Faso", "bi": "Burundi", "kh": "Cambodia", "cm": "Cameroon", "ca": "Canada", "cv": "Cape Verde", "ky": "Cayman Islands", "cf": "Central African Republic", "td": "Chad", "cl": "Chile", "cn": "China", "cx": "Christmas Island", "cc": "Cocos (Keeling) Islands", "co": "Colombia", "km": "Comoros", "cg": "Congo", "cd": "Congo, Democratic Republic of the Congo", "ck": "Cook Islands", "cr": "Costa Rica", "ci": "Cote D'Ivoire", "hr": "Croatia", "cu": "Cuba", "cw": "Curacao", "cy": "Cyprus", "cz": "Czech Republic", "dk": "Denmark", "dj": "Djibouti", "dm": "Dominica", "do": "Dominican Republic", "ec": "Ecuador", "eg": "Egypt", "sv": "El Salvador", "gq": "Equatorial Guinea", "er": "Eritrea", "ee": "Estonia", "et": "Ethiopia", "fk": "Falkland Islands (Malvinas)", "fo": "Faroe Islands", "fj": "Fiji", "fi": "Finland", "fr": "France", "gf": "French Guiana", "pf": "French Polynesia", "tf": "French Southern Territories", "ga": "Gabon", "gm": "Gambia", "ge": "Georgia", "de": "Germany", "gh": "Ghana", "gi": "Gibraltar", "gr": "Greece", "gl": "Greenland", "gd": "Grenada", "gp": "Guadeloupe", "gu": "Guam", "gt": "Guatemala", "gg": "Guernsey", "gn": "Guinea", "gw": "Guinea-Bissau", "gy": "Guyana", "ht": "Haiti", "hm": "Heard Island and Mcdonald Islands", "va": "Holy See (Vatican City State)", "hn": "Honduras", "hk": "Hong Kong", "hu": "Hungary", "is": "Iceland", "in": "India", "id": "Indonesia", "ir": "Iran, Islamic Republic of", "iq": "Iraq", "ie": "Ireland", "im": "Isle of Man", "il": "Israel", "it": "Italy", "jm": "Jamaica", "jp": "Japan", "je": "Jersey", "jo": "Jordan", "kz": "Kazakhstan", "ke": "Kenya", "ki": "Kiribati", "kp": "Korea, Democratic People's Republic of", "kr": "Korea, Republic of", "xk": "Kosovo", "kw": "Kuwait", "kg": "Kyrgyzstan", "la": "Lao People's Democratic Republic", "lv": "Latvia", "lb": "Lebanon", "ls": "Lesotho", "lr": "Liberia", "ly": "Libyan Arab Jamahiriya", "li": "Liechtenstein", "lt": "Lithuania", "lu": "Luxembourg", "mo": "Macao", "mk": "Macedonia, the Former Yugoslav Republic of", "mg": "Madagascar", "mw": "Malawi", "my": "Malaysia", "mv": "Maldives", "ml": "Mali", "mt": "Malta", "mh": "Marshall Islands", "mq": "Martinique", "mr": "Mauritania", "mu": "Mauritius", "yt": "Mayotte", "mx": "Mexico", "fm": "Micronesia, Federated States of", "md": "Moldova, Republic of", "mc": "Monaco", "mn": "Mongolia", "me": "Montenegro", "ms": "Montserrat", "ma": "Morocco", "mz": "Mozambique", "mm": "Myanmar", "na": "Namibia", "nr": "Nauru", "np": "Nepal", "nl": "Netherlands", "nc": "New Caledonia", "nz": "New Zealand", "ni": "Nicaragua", "ne": "Niger", "ng": "Nigeria", "nu": "Niue", "nf": "Norfolk Island", "mp": "Northern Mariana Islands", "no": "Norway", "om": "Oman", "pk": "Pakistan", "pw": "Palau", "ps": "Palestinian Territory, Occupied", "pa": "Panama", "pg": "Papua New Guinea", "py": "Paraguay", "pe": "Peru", "ph": "Philippines", "pn": "Pitcairn", "pl": "Poland", "pt": "Portugal", "pr": "Puerto Rico", "qa": "Qatar", "re": "Reunion", "ro": "Romania", "ru": "Russian Federation", "rw": "Rwanda", "bl": "Saint Barthelemy", "sh": "Saint Helena", "kn": "Saint Kitts and Nevis", "lc": "Saint Lucia", "mf": "Saint Martin", "pm": "Saint Pierre and Miquelon", "vc": "Saint Vincent and the Grenadines", "ws": "Samoa", "sm": "San Marino", "st": "Sao Tome and Principe", "sa": "Saudi Arabia", "sn": "Senegal", "rs": "Serbia", "sc": "Seychelles", "sl": "Sierra Leone", "sg": "Singapore", "sx": "Sint Maarten", "sk": "Slovakia", "si": "Slovenia", "sb": "Solomon Islands", "so": "Somalia", "za": "South Africa", "gs": "South Georgia and the South Sandwich Islands", "ss": "South Sudan", "es": "Spain", "lk": "Sri Lanka", "sd": "Sudan", "sr": "Suriname", "sj": "Svalbard and Jan Mayen", "sz": "Swaziland", "se": "Sweden", "ch": "Switzerland", "sy": "Syrian Arab Republic", "tw": "Taiwan, Province of China", "tj": "Tajikistan", "tz": "Tanzania, United Republic of", "th": "Thailand", "tl": "Timor-Leste", "tg": "Togo", "tk": "Tokelau", "to": "Tonga", "tt": "Trinidad and Tobago", "tn": "Tunisia", "tr": "Turkey", "tm": "Turkmenistan", "tc": "Turks and Caicos Islands", "tv": "Tuvalu", "ug": "Uganda", "ua": "Ukraine", "ae": "United Arab Emirates", "gb": "United Kingdom", "us": "United States", "um": "United States Minor Outlying Islands", "uy": "Uruguay", "uz": "Uzbekistan", "vu": "Vanuatu", "ve": "Venezuela", "vn": "Viet Nam", "vg": "Virgin Islands, British", "vi": "Virgin Islands, U.s.", "wf": "Wallis and Futuna", "eh": "Western Sahara", "ye": "Yemen", "zm": "Zambia", "zw": "Zimbabwe"
        };

        function createArrayItemWrapper(item, path, container, parentArray) {
            const wrapper = document.createElement('div');
            wrapper.className = 'array-item';

            // Remove Btn
            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn-remove';
            removeBtn.textContent = 'Remove';
            removeBtn.onclick = () => {
                // Find index based on current DOM position because indices shift
                const idx = Array.from(container.children).indexOf(wrapper);
                parentArray.splice(idx, 1);
                wrapper.remove();
            };
            wrapper.appendChild(removeBtn);

            // If item is object, recurse
            if (typeof item === 'object') {
                generateFields(item, wrapper, path);
            } else {
                // Primitive in array (e.g. list of strings)
                const input = document.createElement('input');
                input.type = 'text';
                input.value = item;
                input.style.width = '90%';
                input.oninput = (e) => {
                    // Array of primitives, we need to update parentArray by index
                    // But index might shift if we rely on 'path'. 
                    // Better to rely on live index from DOM or object reference if possible. 
                    const idx = Array.from(container.children).indexOf(wrapper);
                    parentArray[idx] = e.target.value;
                };
                wrapper.appendChild(input);
            }
            return wrapper;
        }

        // Helpers
        function switchTab(key, btn) {
            // Update Sidebar
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Update Content
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById(`section-${key}`).classList.add('active');
        }

        function capitalize(str) {
            return str.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
        }

        function getNestedValue(obj, path) {
            return path.reduce((o, k) => (o || {})[k], obj);
        }

        function setNestedValue(obj, path, value) {
            const lastKey = path.pop();
            const lastObj = path.reduce((o, k) => o[k], obj);
            lastObj[lastKey] = value;
            path.push(lastKey); // Restore for other refs
        }

        async function saveData() {
            const btn = document.querySelector('.save-bar .btn-primary');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;

            try {
                // Since `currentData` is mutually bound to inputs, we just send it.
                const res = await fetch('/api/save-portfolio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentData)
                });

                if (res.ok) {
                    showStatus('Changes saved!', 'success');
                } else {
                    showStatus('Server error.', 'error');
                }
            } catch (err) {
                showStatus('Network error.', 'error');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `status-msg status-${type}`;
            setTimeout(() => { statusMsg.textContent = ''; }, 3000);
        }

        function logout() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'auth.html';
        }

        loadData();
    </script>
</body>

</html>
