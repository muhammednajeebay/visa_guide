<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaGuide - Global Visa Services</title>
    <meta name="description" content="Professional visa services for tourists, students, and businesses.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">VisaGuide</a>
            <div class="nav-links" id="nav-links">
                <!-- Links injected by JS -->
            </div>
            <button class="btn-primary desktop-cta">Get Started</button>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero" class="hero-section">
        <!-- Content injected by JS -->
    </header>

    <main>
        <!-- About Section -->
        <section id="about" class="section about-section">
            <div class="container" id="about-container">
                <!-- Content injected by JS -->
            </div>
        </section>

        <!-- Services Section -->
        <section id="services" class="section services-section bg-light">
            <div class="container">
                <div id="services-header" class="section-header"></div>
                <div id="services-grid" class="services-grid grid-3"></div>
            </div>
        </section>

        <!-- Destinations Section -->
        <section id="destinations" class="section destinations-section">
            <div class="container">
                <div id="destinations-header" class="section-header"></div>
                <div id="destinations-grid" class="destinations-grid grid-4"></div>
                <p id="destinations-note" class="text-center mt-4 text-muted"></p>
            </div>
        </section>

        <!-- Why Choose Us -->
        <section id="whyChooseUs" class="section why-section bg-light">
            <div class="container">
                <div id="why-header" class="section-header"></div>
                <div id="why-grid" class="why-grid"></div>
            </div>
        </section>

        <!-- How It Works -->
        <section id="howItWorks" class="section how-section">
            <div class="container">
                <div id="how-header" class="section-header"></div>
                <div id="how-steps" class="how-steps flex-row"></div>
            </div>
        </section>

        <!-- Testimonials -->
        <section id="testimonials" class="section testimonials-section bg-light">
            <div class="container">
                <div id="testimonials-header" class="section-header"></div>
                <div id="testimonials-grid" class="testimonials-grid grid-3"></div>
            </div>
        </section>

        <!-- FAQ -->
        <section id="faq" class="section faq-section">
            <div class="container faq-container-width">
                <div id="faq-header" class="section-header"></div>
                <div id="faq-list" class="faq-list"></div>
            </div>
        </section>

        <!-- Contact -->
        <section id="contact" class="section contact-section gradient-bg text-white">
            <div class="container contact-container-flex">
                <div id="contact-form-wrapper" class="contact-form-wrapper"></div>
                <div id="contact-info-wrapper" class="contact-info-wrapper"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer" class="footer">
        <!-- Content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
